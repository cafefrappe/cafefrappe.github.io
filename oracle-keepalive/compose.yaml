services:
  keeporaclealive:
    build: .
    container_name: keeporaclealive
    restart: unless-stopped
    cpus: ${CONTAINER_CPUS:-1}
    mem_limit: ${CONTAINER_MEM_LIMIT:-1g}
    environment:
      HOST_CPUS: ${HOST_CPUS:-1}
    volumes:
      - /opt/oracle-keepalive:/config
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
